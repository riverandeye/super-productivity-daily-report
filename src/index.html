<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Report</title>
    <style>
      /* Theme variables and the UI Kit are injected by the app before this block. */
      .page {
        max-width: 1200px;
        margin: 0 auto;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s);
        margin-bottom: var(--s);
      }
      .toolbar h1 {
        margin: 0;
        font-size: var(--font-size-xl, 20px);
        min-width: 9em;
      }
      .toolbar .spacer {
        flex: 1;
      }
      .nav-btn {
        min-width: 36px;
      }
      .summary {
        color: var(--text-color-muted);
        font-size: var(--font-size-sm, 13px);
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-half, 4px);
        margin-bottom: var(--s2, 16px);
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--divider-color);
        border-radius: var(--radius-pill, 999px);
        background: transparent;
        color: var(--text-color);
        padding: 3px 10px;
        font: inherit;
        font-size: var(--font-size-sm, 13px);
        cursor: pointer;
      }
      .fchip:hover {
        background: var(--state-hover);
      }
      .fchip.on {
        background: var(--state-selected);
        border-color: var(--c-primary);
      }
      .fchip .n {
        color: var(--text-color-muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        display: inline-block;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: var(--s2, 16px);
        align-items: start;
      }
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }
      .wd {
        text-align: center;
        font-size: var(--font-size-xs, 12px);
        color: var(--text-color-muted);
        padding-bottom: 2px;
      }
      .wd.sun {
        color: var(--color-danger, #e53935);
      }
      .cell {
        position: relative;
        min-height: 78px;
        border-radius: var(--radius-sm, 6px);
        border: 1px solid var(--divider-color);
        background: var(--card-bg);
        padding: 4px 6px;
        text-align: left;
        font: inherit;
        color: var(--text-color);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: hidden;
      }
      .cell:hover {
        border-color: var(--text-color-muted);
      }
      .cell.out {
        opacity: 0.4;
      }
      .cell.today .dnum {
        background: var(--c-primary);
        color: var(--c-contrast);
        border-radius: var(--radius-pill, 999px);
        padding: 0 6px;
      }
      .cell.sel {
        outline: 2px solid var(--c-primary);
        outline-offset: 1px;
      }
      .cell .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dnum {
        font-size: var(--font-size-sm, 13px);
        font-weight: var(--font-weight-medium, 500);
      }
      .total {
        font-size: var(--font-size-sm, 13px);
        font-weight: var(--font-weight-semibold, 600);
      }
      .bars {
        display: flex;
        height: 6px;
        border-radius: 3px;
        overflow: hidden;
        margin-top: auto;
      }
      .plines {
        display: flex;
        flex-direction: column;
        gap: 1px;
        font-size: var(--font-size-xs, 11px);
        line-height: 1.25;
      }
      .pline {
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .pline .dot {
        width: 7px;
        height: 7px;
      }
      @media (max-width: 600px) {
        .plines {
          display: none;
        }
        .cell {
          min-height: 52px;
        }
      }
      .detail {
        background: var(--card-bg);
        border: 1px solid var(--divider-color);
        border-radius: var(--card-border-radius, 8px);
        padding: var(--s, 8px) var(--s2, 16px);
        position: sticky;
        top: var(--s, 8px);
      }
      .detail h2 {
        margin: 4px 0 2px;
        font-size: var(--font-size-lg, 16px);
      }
      .detail .sub {
        color: var(--text-color-muted);
        font-size: var(--font-size-sm, 13px);
        margin-bottom: var(--s, 8px);
      }
      .items {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .item {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 6px 0;
        border-top: 1px solid var(--divider-color);
      }
      .item .dot {
        transform: translateY(1px);
      }
      .item .path {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        line-height: 1.4;
      }
      .item .crumb {
        color: var(--text-color-muted);
      }
      .item .sep {
        color: var(--text-color-muted);
        margin: 0 3px;
      }
      .item .time {
        color: var(--text-color-muted);
        font-size: var(--font-size-xs, 12px);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .empty {
        color: var(--text-color-muted);
        padding: var(--s2, 16px) 0;
        text-align: center;
      }
      .modes {
        display: inline-flex;
        border: 1px solid var(--divider-color);
        border-radius: var(--radius-pill, 999px);
        overflow: hidden;
      }
      .modes button {
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--text-color);
        padding: 3px 12px;
        font: inherit;
        font-size: var(--font-size-sm, 13px);
        cursor: pointer;
      }
      .modes button + button {
        border-left: 1px solid var(--divider-color);
      }
      .modes button.on {
        background: var(--state-selected);
        font-weight: var(--font-weight-semibold, 600);
      }
      .counts {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
      }
      .cell .top {
        gap: 2px;
      }
      .total {
        white-space: nowrap;
      }
      .pbadge {
        font-size: var(--font-size-xs, 11px);
        color: var(--text-color-muted);
        border: 1px dashed var(--text-color-muted);
        border-radius: var(--radius-pill, 999px);
        padding: 0 5px;
        white-space: nowrap;
      }
      .pbadge.overdue,
      .tag.overdue {
        color: var(--color-danger, #e53935);
        border-color: var(--color-danger, #e53935);
      }
      .bars.planned span {
        opacity: 0.55;
      }
      .cell.planned-only {
        border-style: dashed;
      }
      .sec {
        margin: var(--s, 8px) 0 2px;
        font-size: var(--font-size-sm, 13px);
        font-weight: var(--font-weight-semibold, 600);
        color: var(--text-color-muted);
      }
      .item.planned .dot {
        background: transparent !important;
        border: 2px solid currentColor;
        box-sizing: border-box;
      }
      .tag {
        font-size: var(--font-size-xs, 11px);
        border: 1px solid var(--divider-color);
        border-radius: var(--radius-pill, 999px);
        padding: 0 6px;
        margin-left: 4px;
        white-space: nowrap;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: var(--font-size-xs, 12px);
        color: var(--text-color-muted);
        margin-top: var(--s, 8px);
        justify-content: flex-end;
      }
      .legend .sw {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        border: 1px solid var(--divider-color);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="toolbar">
        <button class="btn-text nav-btn" id="prev">‹</button>
        <h1 id="month-label"></h1>
        <button class="btn-text nav-btn" id="next">›</button>
        <button class="btn-outline" id="today"></button>
        <span class="modes" id="modes" role="group"></span>
        <span class="spacer"></span>
        <span class="summary" id="summary"></span>
      </div>
      <div class="filters" id="filters"></div>
      <div class="layout">
        <div>
          <div class="cal" id="cal"></div>
          <div class="legend" id="legend"></div>
        </div>
        <aside class="detail" id="detail"></aside>
      </div>
    </main>

    <!-- @inline lib.js -->

    <script>
      (function () {
        'use strict';
        var L = window.DailyReportLib;
        // English strings, inlined from i18n/en.json at build time. Used until
        // (or if) PluginAPI.translate answers.
        var EN = /* @inline-json i18n/en.json */ {};
        var STR = flatten(EN, '', {});
        var locale = 'en';
        var WEEKDAYS = [];

        function flatten(obj, prefix, out) {
          Object.keys(obj).forEach(function (k) {
            var v = obj[k];
            if (v && typeof v === 'object') flatten(v, prefix + k + '.', out);
            else out[prefix + k] = String(v);
          });
          return out;
        }

        function t(key, params) {
          var s = STR[key] != null ? STR[key] : key;
          return s.replace(/\{\{(\w+)\}\}/g, function (m, k) {
            return params && k in params ? String(params[k]) : m;
          });
        }

        function labels() {
          return { noProject: t('LABEL.NO_PROJECT'), deletedProject: t('LABEL.DELETED_PROJECT'), untitled: t('LABEL.UNTITLED') };
        }

        function computeWeekdays() {
          var f = new Intl.DateTimeFormat(locale, { weekday: 'short' });
          WEEKDAYS = [];
          // 2026-11-01 is a Sunday.
          for (var i = 0; i < 7; i++) WEEKDAYS.push(f.format(new Date(2026, 10, 1 + i)));
        }

        async function loadStrings() {
          try {
            if (typeof PluginAPI.getCurrentLanguage === 'function') {
              var lang = await PluginAPI.getCurrentLanguage();
              if (lang) locale = lang;
            }
          } catch (e) {
            console.warn('[daily-report] getCurrentLanguage failed', e);
          }
          try {
            Intl.DateTimeFormat.supportedLocalesOf([locale]);
          } catch (e) {
            locale = 'en';
          }
          document.documentElement.lang = locale;
          var keys = Object.keys(flatten(EN, '', {}));
          var next = flatten(EN, '', {});
          if (typeof PluginAPI.translate === 'function') {
            await Promise.all(keys.map(async function (k) {
              try {
                var v = await PluginAPI.translate(k);
                if (typeof v === 'string' && v && v !== k) next[k] = v;
              } catch (e) {
                /* keep English */
              }
            }));
          }
          STR = next;
          computeWeekdays();
          $('prev').title = t('NAV.PREV');
          $('prev').setAttribute('aria-label', t('NAV.PREV'));
          $('next').title = t('NAV.NEXT');
          $('next').setAttribute('aria-label', t('NAV.NEXT'));
          $('today').textContent = t('NAV.TODAY');
          document.title = t('TITLE');
        }
        var LEVEL_ALPHA = [0, 14, 28, 44, 62];

        var now = new Date();
        var state = {
          year: now.getFullYear(),
          month: now.getMonth(),
          selectedKey: null,
          selectedProjects: new Set(),
          mode: 'both', // 'done' | 'planned' | 'both'
          index: { byDay: new Map(), plannedByDay: new Map(), projects: [] },
          sig: null,
          dayOffsetMs: 0,
          todayKey: L.dateKeyOf(now.getFullYear(), now.getMonth(), now.getDate()),
        };

        function $(id) {
          return document.getElementById(id);
        }

        function el(tag, cls, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          return e;
        }

        function tint(color, pct) {
          return 'color-mix(in srgb, ' + color + ' ' + pct + '%, var(--card-bg))';
        }

        function itemsFor(key) {
          if (state.mode === 'planned') return [];
          return L.filterItems(state.index.byDay.get(key), state.selectedProjects);
        }

        function plannedFor(key) {
          if (state.mode === 'done') return [];
          return L.filterItems(state.index.plannedByDay.get(key), state.selectedProjects);
        }

        function isPast(key) {
          return key < state.todayKey;
        }

        // ---------- data ----------
        async function loadDayContext() {
          try {
            if (typeof PluginAPI.getDayContext === 'function') {
              var ctx = await PluginAPI.getDayContext();
              if (ctx) {
                state.dayOffsetMs = ctx.startOfNextDayDiffMs || 0;
                if (ctx.todayStr) state.todayKey = ctx.todayStr;
              }
            }
          } catch (e) {
            console.warn('[daily-report] getDayContext failed', e);
          }
        }

        async function load(force) {
          var res = await Promise.all([
            PluginAPI.getTasks(),
            PluginAPI.getArchivedTasks().catch(function (e) {
              console.warn('[daily-report] getArchivedTasks failed', e);
              return [];
            }),
            PluginAPI.getAllProjects(),
          ]);
          var index = L.buildIndex(res[0], res[1], res[2], state.dayOffsetMs, labels());
          var sig = L.signature(index) + '#' + state.todayKey;
          if (!force && sig === state.sig) return;
          state.sig = sig;
          state.index = index;
          // Drop filters for projects that no longer exist.
          var ids = new Set(index.projects.map(function (p) { return p.id; }));
          state.selectedProjects.forEach(function (id) {
            if (!ids.has(id)) state.selectedProjects.delete(id);
          });
          render();
        }

        var refreshTimer = null;
        function scheduleRefresh() {
          clearTimeout(refreshTimer);
          refreshTimer = setTimeout(function () {
            load(false).catch(function (e) {
              console.error('[daily-report] refresh failed', e);
            });
          }, 400);
        }

        // ---------- render ----------
        function render() {
          renderModes();
          renderToolbar();
          renderFilters();
          renderCalendar();
          renderDetail();
        }

        function monthKeys() {
          var keys = [];
          var days = new Date(state.year, state.month + 1, 0).getDate();
          for (var d = 1; d <= days; d++) keys.push(L.dateKeyOf(state.year, state.month, d));
          return keys;
        }

        function renderModes() {
          var box = $('modes');
          box.replaceChildren();
          [['done', 'MODE.DONE'], ['planned', 'MODE.PLANNED'], ['both', 'MODE.BOTH']].forEach(function (m) {
            var b = el('button', state.mode === m[0] ? 'on' : '', t(m[1]));
            b.type = 'button';
            b.setAttribute('aria-pressed', String(state.mode === m[0]));
            b.addEventListener('click', function () {
              state.mode = m[0];
              render();
            });
            box.appendChild(b);
          });
        }

        function renderToolbar() {
          $('month-label').textContent = new Intl.DateTimeFormat(locale, { year: 'numeric', month: 'long' }).format(new Date(state.year, state.month, 1));
          var total = 0;
          var activeDays = 0;
          var planned = 0;
          monthKeys().forEach(function (k) {
            var n = itemsFor(k).length;
            total += n;
            if (n) activeDays++;
            planned += plannedFor(k).length;
          });
          $('summary').textContent =
            state.mode === 'done'
              ? t('SUMMARY', { count: total, days: activeDays })
              : state.mode === 'planned'
                ? t('SUMMARY_PLANNED', { count: planned })
                : t('SUMMARY_BOTH', { count: total, planned: planned });
        }

        function renderFilters() {
          var box = $('filters');
          box.replaceChildren();
          var all = el('button', 'fchip' + (state.selectedProjects.size === 0 ? ' on' : ''), t('FILTER.ALL'));
          all.addEventListener('click', function () {
            state.selectedProjects.clear();
            render();
          });
          box.appendChild(all);
          state.index.projects.forEach(function (p) {
            var b = el('button', 'fchip' + (state.selectedProjects.has(p.id) ? ' on' : ''));
            var dot = el('span', 'dot');
            dot.style.background = p.color;
            b.appendChild(dot);
            b.appendChild(document.createTextNode(p.title));
            var n = state.mode === 'done' ? p.total : state.mode === 'planned' ? p.plannedTotal : p.total + '/' + p.plannedTotal;
            b.appendChild(el('span', 'n', String(n)));
            b.title = t('FILTER.TOGGLE_HINT');
            b.addEventListener('click', function () {
              if (state.selectedProjects.has(p.id)) state.selectedProjects.delete(p.id);
              else state.selectedProjects.add(p.id);
              render();
            });
            box.appendChild(b);
          });
        }

        function renderCalendar() {
          var cal = $('cal');
          cal.replaceChildren();
          WEEKDAYS.forEach(function (w, i) {
            cal.appendChild(el('div', 'wd' + (i === 0 ? ' sun' : ''), w));
          });
          var weeks = L.monthGrid(state.year, state.month, 0);
          var max = 0;
          weeks.forEach(function (w) {
            w.forEach(function (c) {
              if (c.inMonth) max = Math.max(max, (state.mode === 'planned' ? plannedFor(c.key) : itemsFor(c.key)).length);
            });
          });

          weeks.forEach(function (week) {
            week.forEach(function (c) {
              var planned = plannedFor(c.key);
              var plannedView = state.mode === 'planned';
              // The list that drives shading, dots and bars.
              var items = plannedView ? planned : itemsFor(c.key);
              var doneCount = plannedView ? 0 : items.length;
              var groups = L.countByProject(items);
              var cls = 'cell';
              if (!c.inMonth) cls += ' out';
              if (c.key === state.todayKey) cls += ' today';
              if (c.key === state.selectedKey) cls += ' sel';
              if (plannedView && items.length) cls += ' planned-only';
              var cell = el('button', cls);
              cell.type = 'button';
              cell.setAttribute('aria-label', t('CELL.ARIA', { date: c.key, count: doneCount, planned: planned.length }));

              var level = L.intensityLevel(items.length, max);
              if (level > 0) cell.style.background = tint(groups[0].color, LEVEL_ALPHA[level]);

              var top = el('div', 'top');
              top.appendChild(el('span', 'dnum', String(c.day)));
              var counts = el('span', 'counts');
              if (items.length) counts.appendChild(el('span', 'total', t('CELL.COUNT', { count: items.length })));
              if (state.mode === 'both' && planned.length) {
                var pb = el('span', 'pbadge' + (isPast(c.key) ? ' overdue' : ''), '○' + planned.length);
                pb.title = t('PLANNED_BADGE', { count: planned.length });
                counts.appendChild(pb);
              }
              top.appendChild(counts);
              cell.appendChild(top);

              if (groups.length) {
                var lines = el('div', 'plines');
                groups.slice(0, 3).forEach(function (g) {
                  var line = el('div', 'pline');
                  var d = el('span', 'dot');
                  d.style.background = g.color;
                  line.appendChild(d);
                  line.appendChild(document.createTextNode(String(g.count)));
                  line.title = t('CELL.PROJECT_COUNT', { project: g.title, count: g.count });
                  lines.appendChild(line);
                });
                if (groups.length > 3) lines.appendChild(el('div', 'pline', '+' + (groups.length - 3)));
                cell.appendChild(lines);

                var bars = el('div', 'bars' + (plannedView ? ' planned' : ''));
                groups.forEach(function (g) {
                  var s = el('span');
                  s.style.flex = String(g.count);
                  s.style.background = g.color;
                  bars.appendChild(s);
                });
                cell.appendChild(bars);
              }

              cell.addEventListener('click', function () {
                state.selectedKey = c.key;
                if (!c.inMonth) {
                  var p = c.key.split('-');
                  state.year = +p[0];
                  state.month = +p[1] - 1;
                }
                render();
              });
              cal.appendChild(cell);
            });
          });

          var legend = $('legend');
          legend.replaceChildren(el('span', null, t('LEGEND.LESS')));
          for (var lv = 1; lv <= 4; lv++) {
            var sw = el('span', 'sw');
            sw.style.background = tint('var(--c-primary)', LEVEL_ALPHA[lv]);
            legend.appendChild(sw);
          }
          legend.appendChild(el('span', null, t('LEGEND.MORE')));
        }

        function fmtTime(ms) {
          return new Intl.DateTimeFormat(locale, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ms));
        }

        function fmtDayTitle(key) {
          var p = key.split('-');
          return new Intl.DateTimeFormat(locale, { month: 'long', day: 'numeric', weekday: 'short' }).format(new Date(+p[0], +p[1] - 1, +p[2]));
        }

        function renderDetail() {
          var box = $('detail');
          box.replaceChildren();
          if (!state.selectedKey) {
            box.appendChild(el('h2', null, t('DETAIL.PICK_TITLE')));
            box.appendChild(el('div', 'sub', t('DETAIL.PICK_HINT')));
            return;
          }
          var key = state.selectedKey;
          var done = itemsFor(key);
          var planned = plannedFor(key);
          box.appendChild(el('h2', null, fmtDayTitle(key)));
          var all = done.concat(planned);
          var groups = L.countByProject(done);
          var sub = done.length
            ? t('DETAIL.SUMMARY', { count: done.length, projects: groups.map(function (g) { return g.title + ' ' + g.count; }).join(', ') })
            : '';
          box.appendChild(el('div', 'sub', sub));
          if (!all.length) {
            var emptyKey = state.mode === 'done' ? 'DETAIL.EMPTY' : state.mode === 'planned' ? 'DETAIL.EMPTY_PLANNED' : 'DETAIL.EMPTY_BOTH';
            box.appendChild(el('div', 'empty', t(emptyKey)));
            return;
          }
          if (done.length) {
            if (state.mode === 'both') box.appendChild(el('div', 'sec', t('SECTION.DONE', { count: done.length })));
            box.appendChild(itemList(done, false));
          }
          if (planned.length) {
            if (state.mode === 'both') box.appendChild(el('div', 'sec', t('SECTION.PLANNED', { count: planned.length })));
            box.appendChild(itemList(planned, true));
          }
        }

        function itemList(items, isPlanned) {
          var overdue = isPlanned && isPast(state.selectedKey);
          var ul = el('ul', 'items');
          items.forEach(function (it) {
            var li = el('li', 'item' + (isPlanned ? ' planned' : ''));
            var dot = el('span', 'dot');
            dot.style.background = it.color;
            dot.style.color = it.color;
            li.appendChild(dot);
            var path = el('span', 'path');
            it.path.forEach(function (part, i) {
              if (i > 0) path.appendChild(el('span', 'sep', '›'));
              path.appendChild(el('span', i < it.path.length - 1 ? 'crumb' : 'leaf', part));
            });
            if (overdue) path.appendChild(el('span', 'tag overdue', t('OVERDUE')));
            li.appendChild(path);
            var time = isPlanned ? (it.due ? fmtTime(it.due) : t('ALL_DAY')) : fmtTime(it.doneOn);
            li.appendChild(el('span', 'time', time));
            li.title = it.path.join(' › ');
            ul.appendChild(li);
          });
          return ul;
        }

        // ---------- events ----------
        function shiftMonth(delta) {
          var d = new Date(state.year, state.month + delta, 1);
          state.year = d.getFullYear();
          state.month = d.getMonth();
          render();
        }

        $('prev').addEventListener('click', function () { shiftMonth(-1); });
        $('next').addEventListener('click', function () { shiftMonth(1); });
        $('today').addEventListener('click', function () {
          var p = state.todayKey.split('-');
          state.year = +p[0];
          state.month = +p[1] - 1;
          state.selectedKey = state.todayKey;
          render();
        });
        document.addEventListener('keydown', function (e) {
          if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
          if (e.key === 'ArrowLeft') shiftMonth(-1);
          else if (e.key === 'ArrowRight') shiftMonth(1);
        });

        function setupHooks() {
          var H = PluginAPI.Hooks || {};
          // DATA_CHANGED covers everything (incl. sync); the rest are fallbacks.
          [H.DATA_CHANGED, H.TASK_COMPLETE, H.TASK_UPDATE, H.TASK_DELETE, H.PROJECT_LIST_UPDATE]
            .filter(Boolean)
            .forEach(function (h) {
              try {
                PluginAPI.registerHook(h, scheduleRefresh);
              } catch (e) {
                console.warn('[daily-report] hook not available', h, e);
              }
            });
          if (H.LANGUAGE_CHANGE) {
            PluginAPI.registerHook(H.LANGUAGE_CHANGE, function () {
              loadStrings().then(function () { return load(true); });
            });
          }
          if (H.DAY_CHANGE) {
            PluginAPI.registerHook(H.DAY_CHANGE, function (payload) {
              if (payload && payload.todayStr) state.todayKey = payload.todayStr;
              state.sig = null;
              loadDayContext().then(function () { return load(true); });
            });
          }
        }

        async function init() {
          computeWeekdays();
          await loadStrings();
          state.selectedKey = state.todayKey;
          render();
          await loadDayContext();
          state.selectedKey = state.todayKey;
          var p = state.todayKey.split('-');
          state.year = +p[0];
          state.month = +p[1] - 1;
          try {
            await load(true);
          } catch (e) {
            console.error('[daily-report] load failed', e);
            $('detail').replaceChildren(el('div', 'empty', t('DETAIL.LOAD_ERROR', { error: e && e.message ? e.message : String(e) })));
          }
          setupHooks();
        }

        (function waitForPlugin() {
          if (typeof PluginAPI !== 'undefined') init();
          else setTimeout(waitForPlugin, 50);
        })();
      })();
    </script>
  </body>
</html>
